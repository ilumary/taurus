[package]
name = "taurus"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "quic"
path = "src/quic/lib.rs"

[[bin]]
name = "quic_bin"
path = "src/main.rs"

[dependencies]
octets = "0.3.5"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std"] }
rcgen = "0.14.7"
rand = "0.10.0"
ring = "0.17.14"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["time"] }
futures = "0.3.32"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "std"] }
indexmap = "2.13.1"
parking_lot = "0.12.5"
intrusive-collections = "0.10.0"
thingbuf = {version = "0.1.6", features = ["static", "alloc"]}
socket2 = "0.6.3"
smallvec = "1.15.1"
async-trait = "0.1.89"
