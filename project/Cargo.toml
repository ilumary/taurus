[package]
name = "taurus"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "quic"
path = "src/quic/lib.rs"

[features]
uring_backend = ["dep:io-uring"]

[dependencies]
octets = "0.3.6"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
rcgen = "0.14.8"
rand = "0.10.2"
ring = "0.17.14"
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
socket2 = { version = "0.6.5", features = ["all"] }
smallvec = "1.15.2"
libc = "0.2.186"
slab = "0.4.12"
crossbeam-channel = "0.5.16"
async-task = "4.7.1"
rustc-hash = "2.1.3"
io-uring = { version = "0.7.14", optional = true }

[dev-dependencies]
time = "0.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "std"] }

